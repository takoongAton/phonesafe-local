<!DOCTYPE html>
<html lang="ko">
	<head>
	<title>휴대폰안심 서비스</title>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />

	<!-- font -->
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=block" rel="stylesheet" />

	<!-- css -->
	<link rel="stylesheet" href="../../css/reset.css" />
	<link rel="stylesheet" href="../../css/phonesafe.css" />
	<!-- <link rel="stylesheet" href="../../css/Global.css" /> -->
	<!-- <link rel="stylesheet" href="../../css/slick.css" /> -->
</head>
<body>

<div class="wrap">

	<div class="header_wrap">
		<div class="temp">
			<div class="util">
				<!-- <button type="button"><span><img src="../../images/temp/btn_top_back.png" alt="이전"></span></button> -->
				<button type="button"><span><img src="../../images/temp/btn_top_home.png" alt="홈"></span></button>
			</div>
			<h1>휴대폰안심</h1>
			<div class="tools">
				<!-- <button type="button"><span><img src="../../images/temp/btn_top_more.png" alt="더보기"></span></button> -->
				<button type="button"><span><img src="../../images/temp/btn_menu_more.png" alt="더보기"></span></button>
				<button type="button"><span><img src="../../images/temp/btn_memu_alarm_n.png" alt="알람"></span></button>
			</div>
		</div>
		<!-- // temp 삭제 -->

		<nav class="benefit">
			<div class="scroll-wrapper">
				<ul class="scroll">
					<li class="item"><button type="button"><span>홈</span></button></li>
					<li class="item"><button type="button"><span>웹 검사</span></button></li>
					<li class="item"><button type="button"><span>보안 검사</span></button></li>
					<li class="item"><button type="button"><span>보안매거진</span></button></li>
					<li class="item"><button type="button" class="active"><span class="benefit"><i class="ico"><img src="../../images/coupon/ico_gift.svg" alt=""></i>혜택<em class="dot"></em></span></button></li>
				</ul>
			</div>
		</nav>
		<!-- // nav-->

		<div class="tab_wrap">
			<button type="button"><span>쿠폰 받기</span></button>
			<button type="button" class="active"><span>쿠폰함</span></button>
		</div>
		<!-- // tab_wrap -->
	</div>
	<!-- // header_wrap -->

	<div class="container_wrap">

		<section class="container">

			<div class="content_wrap divide">

				<div class="content_mid empty">

					<div class="sub_tab_wrap">
						<div>
							<button type="button" class="active"><span>보유</span></button>
							<button type="button"><span>이용내역</span></button>
						</div>
						<p></p>
					</div>

					<div class="coupon_error">
						<span class="ico"><img src="../../images/coupon/ico_coupon_empty.svg" alt=""></span>
						<div class="txt_wrap">
							<strong>보유한 쿠폰이 없어요.</strong>
							<p>편의점에서 바로 쓸 수 있는<br />쿠폰을 받아보세요.</p>
						</div>
						<button type="button"><span class="txt">쿠폰 받으러 가기</span></button>
					</div>
					<!-- // coupon_error -->

				</div>
				<!-- // content_mid -->

				<div class="content_btm"></div>

			</div><!-- // content_wrap -->

		</section><!-- // container -->

	</div><!-- // container_wrap -->

</div><!-- // wrap -->



<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<!-- <script src="../../js/slick.js"></script> -->
<script src="../../js/temp.js"></script>

</body>
</html>
