<!DOCTYPE html>
<html lang="ko">
	<head>
	<title>휴대폰안심 서비스</title>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />

	<!-- font -->
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=block" rel="stylesheet" />

	<!-- css -->
	<link rel="stylesheet" href="../../css/reset.css" />
	<link rel="stylesheet" href="../../css/phonesafe_app.css" />
	<!-- <link rel="stylesheet" href="../../css/Global.css" /> -->
	<!-- <link rel="stylesheet" href="../../css/slick.css" /> -->
</head>
<body>

<div class="wrap">

	<div class="header_wrap">
		<div class="temp_native">
			<div class="util">
				<!-- <button type="button"><span><img src="../../images/temp/btn_top_back.png" alt="이전"></span></button> -->
				<button type="button"><span><img src="../../images/temp/btn_top_home.png" alt="홈"></span></button>
			</div>
			<h1>휴대폰안심</h1>
			<div class="tools">
				<!-- <button type="button"><span><img src="../../images/temp/btn_top_more.png" alt="더보기"></span></button> -->
				<button type="button"><span><img src="../../images/temp/btn_menu_more.png" alt="더보기"></span></button>
				<button type="button"><span><img src="../../images/temp/btn_memu_alarm_n.png" alt="알람"></span></button>
			</div>
		</div>
		<!-- // temp 삭제 -->

		<nav class="benefit">
			<div class="scroll-wrapper">
				<ul class="scroll">
					<li class="item"><button type="button"><span>홈</span></button></li>
					<li class="item"><button type="button"><span>웹 검사</span></button></li>
					<li class="item"><button type="button"><span>보안 검사</span></button></li>
					<li class="item"><button type="button"><span>보안매거진</span></button></li>
					<li class="item"><button type="button" class="active"><span class="benefit"><i class="ico"><img src="../../images/coupon/ico_gift.svg" alt=""></i>혜택<em class="dot"></em></span></button></li>
				</ul>
			</div>
		</nav>
		<!-- // nav-->

		<div class="tab_wrap">
			<button type="button"><span>쿠폰 받기</span></button>
			<button type="button" class="active"><span>쿠폰함</span></button>
		</div>
		<!-- // tab_wrap -->
	</div>
	<!-- // header_wrap -->

	<div class="container_wrap">

		<section class="container">

			<div class="content_wrap divide">

				<div class="content_mid">

					<div class="sub_tab_wrap">
						<div>
							<button type="button" class="active"><span>보유</span></button>
							<button type="button"><span>이용내역</span></button>
						</div>
						<p>발급받은 쿠폰을 확인하고 사용하세요</p>
					</div>

					<div class="subResurtTit">
						<p class="tit">
							<strong>편의점 쿠폰 · 3</strong>
						</p>
					</div>

					<div class="my_coupon_list">
						<div class="inner">
							<div class="item">
								<div class="head">
									<span class="brand"><img src="../../images/coupon/img_cu_s.png" alt="CU"></span>
									<strong class="price">CU 1,000원 쿠폰</strong>
								</div>
								<div class="barcode">
									<img src="../../images/coupon/img_barcode_bars.svg" alt="바코드 이미지">
									<span class="num">1234 5678 9012 3456</span>
									<span class="date">유효기간 : 2026.08.07까지</span>
								</div>
							</div>
							<div class="item">
								<div class="head">
									<span class="brand"><img src="../../images/coupon/img_gs25_s.png" alt="GS25"></span>
									<strong class="price">GS25 1,000원 쿠폰</strong>
								</div>
								<div class="barcode">
									<img src="../../images/coupon/img_barcode_bars.svg" alt="바코드 이미지">
									<span class="num">1234 5678 9012 3456</span>
									<span class="date">유효기간 : 2026.08.07까지</span>
								</div>
							</div>
							<div class="item">
								<div class="head">
									<span class="brand"><img src="../../images/coupon/img_711_s.png" alt="세븐일레븐"></span>
									<strong class="price">세븐일레븐 1,000원 쿠폰</strong>
								</div>
								<div class="barcode">
									<img src="../../images/coupon/img_barcode_bars.svg" alt="바코드 이미지">
									<span class="num">1234 5678 9012 3456</span>
									<span class="date">유효기간 : 2026.08.07까지</span>
								</div>
							</div>
						</div>
						<!-- // inner -->
					</div>
					<!-- // my_coupon_list -->

				</div>
				<!-- // content_mid -->

				<div class="content_btm"></div>

			</div><!-- // content_wrap -->

		</section><!-- // container -->

	</div><!-- // container_wrap -->

</div><!-- // wrap -->


<!-- 쿠폰 바코드 레이어 팝업 -->
<div class="layer coupon">
	<div class="dim"></div>
	<div class="layer_inner">
		<div class="head">
			<div>
				<span class="brand"><img src="../../images/coupon/img_cu_s.png" alt="CU"></span>
				<strong class="price">CU 1,000원 쿠폰</strong>
			</div>
			<button type="button" class="close"><img src="../../images/coupon/btn_coupon_close.svg" alt="닫기"></button>
		</div>
		<div class="barcode">
			<img src="../../images/coupon/img_barcode_bars_lg.svg" alt="바코드 이미지">
			<span class="num">1234 5678 9012 3456</span>
			<span class="date">유효기간 : 2026.08.07까지</span>
		</div>
	</div>
</div>
<!-- // 쿠폰 바코드 레이어 팝업 -->



<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<!-- <script src="../../js/slick.js"></script> -->
<script src="../../js/temp.js"></script>

<script>

/* 보유 쿠폰 선택 시 바코드 확대 레이어 */
let couponLayer = document.querySelector(".layer.coupon");
if(couponLayer) {
	document.querySelectorAll(".my_coupon_list .item").forEach(function(item){
		item.addEventListener("click", function(){
			couponLayer.style.display = "block";
		})
	})
	couponLayer.querySelector(".close").addEventListener("click", function(){
		couponLayer.style.display = "none";
	})
	couponLayer.querySelector(".dim").addEventListener("click", function(){
		couponLayer.style.display = "none";
	})
}
/* // 보유 쿠폰 선택 시 바코드 확대 레이어 */

</script>

</body>
</html>
